<script>
/* BC Bundle Link loader.
   Small enough to paste inline (so BigCommerce's save API won't 502), and it
   fetches the real script WITH the ngrok-skip-browser-warning header (so ngrok's
   free-tier interstitial doesn't return an HTML page instead of the JS).
   Update the URL below if your ngrok/host URL changes. */
(function () {
  var SRC = 'https://bigc-product-bundle.onrender.com/storefront/bundle-link.js';
  fetch(SRC, { headers: { 'ngrok-skip-browser-warning': 'true' } })
    .then(function (r) { return r.text(); })
    .then(function (code) {
      var s = document.createElement('script');
      s.textContent = code;
      document.body.appendChild(s);
    })
    .catch(function (e) { console.error('[BC Bundles] loader failed:', e); });
})();
</script>
